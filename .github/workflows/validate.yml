name: Validate

# Every pull request, every push to main, and every night: both lists pass the checks Localix and
# Claude Code apply to them. Mini app entries are checked with Localix's own rules (from the mini app
# kit; no curation: Localix takes none from this list) and followed to their authors' released
# marketplaces, which must answer, read as Localix reads them, and build the app. Nothing an entry
# points at is run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mini-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: rsaryev/localix-marketplace
          path: .localix-marketplace
          sparse-checkout: plugins/mini-app-authoring
      - uses: oven-sh/setup-bun@v2
      - name: Mini apps
        run: .localix-marketplace/plugins/mini-app-authoring/bin/mini-app marketplace validate --fetch

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plugins
        run: claude plugin validate .
